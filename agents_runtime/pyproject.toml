[project]
name = "agents-runtime"
version = "0.1.0"
description = "Pure runtime package for AI analytics agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "chromadb>=1.5.0",
  "openai-agents>=0.8.4",
  "pydantic>=2.12.5",
  "python-dotenv>=1.2.1",
  "pyodbc>=5.3.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_runtime"]
